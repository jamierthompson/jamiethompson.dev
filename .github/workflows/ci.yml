name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A newer push to the same branch makes the in-flight run obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Runs the same commands in the same order as the local gate, so green
  # locally means green here. Keep the two in step.
  gate:
    name: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # pnpm/setup takes the runtime as an input rather than a version file, so
      # .nvmrc is read here to stay the single source of truth for Node.
      - id: node
        run: echo "version=$(cat .nvmrc)" >> "$GITHUB_OUTPUT"

      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          runtime: node@${{ steps.node.outputs.version }}
          cache: true
          install: false

      - run: pnpm install --frozen-lockfile

      - run: pnpm run format:check

      - run: pnpm run check

      - run: pnpm run test

      # test:e2e builds and then serves dist/ via `astro preview`, so the
      # production build is covered by this step too.
      - run: pnpm dlx playwright install --with-deps chromium
      - run: pnpm run test:e2e

      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
